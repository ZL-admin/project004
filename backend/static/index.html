<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anime AI Roleplay · MVP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh; display: flex;
    background: linear-gradient(135deg, #f5e6ff 0%, #e6f0ff 100%);
    color: #2b2b3a;
  }
  /* 左栏：角色列表 */
  #sidebar {
    width: 260px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
    border-right: 1px solid #e6d9f5; overflow-y: auto; flex-shrink: 0;
  }
  #sidebar h1 { font-size: 16px; padding: 16px; color: #8b5cf6; }
  .char {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    cursor: pointer; border-bottom: 1px solid #f0eaf8; transition: background .15s;
  }
  .char:hover { background: #f3ecff; }
  .char.active { background: #ede0ff; }
  .char .emoji { font-size: 26px; }
  .char .name { font-weight: 600; font-size: 14px; }
  .char .tag { font-size: 12px; color: #999; }
  /* 右栏：聊天 */
  #main { flex: 1; display: flex; flex-direction: column; }
  #header {
    padding: 14px 20px; background: rgba(255,255,255,0.8);
    border-bottom: 1px solid #e6d9f5; font-weight: 600; display: flex;
    align-items: center; gap: 10px; min-height: 56px;
  }
  #header .badge { font-size: 11px; color: #fff; background: #a78bfa;
    padding: 2px 8px; border-radius: 10px; margin-left: auto; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 12px; }
  .bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .bubble.user { align-self: flex-end; background: #8b5cf6; color: #fff;
    border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: #fff;
    border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  #empty { margin: auto; color: #b0a8c0; text-align: center; font-size: 14px; }
  #composer { display: flex; gap: 10px; padding: 14px 20px;
    background: rgba(255,255,255,0.8); border-top: 1px solid #e6d9f5; }
  #input { flex: 1; padding: 10px 14px; border: 1px solid #d8c9ee;
    border-radius: 20px; font-size: 14px; outline: none; }
  #input:focus { border-color: #a78bfa; }
  #send { padding: 10px 22px; background: #8b5cf6; color: #fff; border: none;
    border-radius: 20px; cursor: pointer; font-size: 14px; }
  #send:disabled { background: #c9bce6; cursor: not-allowed; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>✨ Pick a character</h1>
    <div id="charList"></div>
  </div>
  <div id="main">
    <div id="header"><span id="title">No character selected</span>
      <span class="badge" id="backend">…</span></div>
    <div id="messages"><div id="empty">← Pick a character on the left to start chatting</div></div>
    <div id="composer">
      <input id="input" placeholder="Say something…" disabled />
      <button id="send" disabled>Send</button>
    </div>
  </div>

<script>
let currentChar = null;
const $ = (id) => document.getElementById(id);

async function init() {
  // 显示当前 LLM 后端
  try {
    const h = await (await fetch("/api/health")).json();
    $("backend").textContent = "LLM: " + h.llm_backend;
  } catch (e) { $("backend").textContent = "Backend offline"; }

  const chars = await (await fetch("/api/characters")).json();
  const list = $("charList");
  chars.forEach((c) => {
    const el = document.createElement("div");
    el.className = "char";
    el.innerHTML = `<span class="emoji">${c.avatar}</span>
      <div><div class="name">${c.name}</div><div class="tag">${c.tagline}</div></div>`;
    el.onclick = () => selectChar(c, el);
    list.appendChild(el);
  });
}

function selectChar(c, el) {
  currentChar = c.id;
  document.querySelectorAll(".char").forEach((x) => x.classList.remove("active"));
  el.classList.add("active");
  $("title").textContent = `${c.avatar} ${c.name}`;
  $("messages").innerHTML = "";
  addBubble("assistant", c.greeting);
  $("input").disabled = false;
  $("send").disabled = false;
  $("input").focus();
}

function addBubble(role, text) {
  const b = document.createElement("div");
  b.className = "bubble " + role;
  b.textContent = text;
  $("messages").appendChild(b);
  scrollBottom();
  return b;
}
function scrollBottom() { $("messages").scrollTop = $("messages").scrollHeight; }

function parseSSE(block) {
  let event = "message", data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; } catch { return null; }
}

async function send() {
  const text = $("input").value.trim();
  if (!text || !currentChar) return;
  $("input").value = "";
  $("send").disabled = true;
  addBubble("user", text);
  const bubble = addBubble("assistant", "");

  try {
    const resp = await fetch(`/api/conversations/${currentChar}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const ev = parseSSE(part);
        if (!ev) continue;
        if (ev.event === "token") bubble.textContent += ev.data.t;
        else if (ev.event === "blocked") bubble.textContent = ev.data.fallback;
        else if (ev.event === "error") bubble.textContent = "[Error] " + ev.data.message;
        scrollBottom();
      }
    }
  } catch (e) {
    bubble.textContent = "[Network error] " + e.message;
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
}

$("send").onclick = send;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
init();
</script>
</body>
</html>
