<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Anime AI Roleplay · Chat with your favorite characters</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #f5e6ff 0%, #e6f0ff 100%);
    color: #2b2b3a;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 720px; margin: 0 auto; }

  header {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid #e6d9f5;
  }
  header .title { font-weight: 700; font-size: 16px; color: #8b5cf6; }
  header .badge {
    margin-left: auto; font-size: 11px; color: #fff; background: #c0aee6;
    padding: 4px 10px; border-radius: 12px; cursor: pointer; white-space: nowrap;
  }
  header .badge.on { background: #34c759; }

  .notice { font-size: 12px; color: #8a7fa8; background: #faf6ff; padding: 7px 16px;
    border-bottom: 1px solid #f0eaf8; line-height: 1.4; }

  /* Character bar */
  .chars { display: flex; gap: 12px; padding: 12px 16px; overflow-x: auto;
    background: rgba(255,255,255,0.5); border-bottom: 1px solid #e6d9f5; }
  .chars::-webkit-scrollbar { display: none; }
  .char { flex: 0 0 auto; text-align: center; cursor: pointer; width: 64px; }
  .char .ava {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 4px;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    background: #fff; border: 2px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    transition: border-color .15s, transform .15s;
  }
  .char.active .ava { border-color: #8b5cf6; transform: scale(1.08); }
  .char .nm { font-size: 11px; color: #6b6480; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Messages */
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .messages .empty { margin: auto; color: #b0a8c0; font-size: 14px; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.55;
    font-size: 15px; white-space: pre-wrap; word-break: break-word; animation: pop .12s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .bubble.user { align-self: flex-end; background: #8b5cf6; color: #fff; border-bottom-right-radius: 5px; }
  .bubble.assistant { align-self: flex-start; background: #fff; border-bottom-left-radius: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  /* Composer */
  .composer { display: flex; gap: 8px; padding: 12px 16px;
    background: rgba(255,255,255,0.85); border-top: 1px solid #e6d9f5;
    padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #input { flex: 1; padding: 11px 16px; border: 1px solid #d8c9ee; border-radius: 22px;
    font-size: 16px; outline: none; background: #fff; }
  #input:focus { border-color: #a78bfa; }
  #send { padding: 0 22px; background: #8b5cf6; color: #fff; border: none; border-radius: 22px;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  #send:disabled { background: #c9bce6; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">✨ Anime AI Roleplay</div>
    <div class="badge" id="modeBadge" title="Tap to set backend URL">Demo · Offline</div>
  </header>
  <div class="notice" id="notice">Connecting to AI…</div>
  <div class="chars" id="charBar"></div>
  <div class="messages" id="messages"><div class="empty">↑ Pick a character to start chatting</div></div>
  <div class="composer">
    <input id="input" placeholder="Say something…" autocomplete="off" disabled />
    <button id="send" disabled>Send</button>
  </div>
</div>

<script>
// ===== Default backend (the user's deployed Hugging Face Space) =====
const DEFAULT_BACKEND = "https://zl-admin-anime-rp-backend.hf.space";

// ===== Embedded character data (mirrors backend characters.py; original designs to avoid IP issues) =====
const DATA = [
  { id:"rin", name:"Rin Aoi", tagline:"Tsundere kendo captain", avatar:"🗡️",
    greeting:"Hmph, you're late again! ...I-it's not like I was worried about you! Rules are rules, okay?",
    replies:[
      "Hmph, \"{msg}\"... I-it's not like I'm answering just because you said so!",
      "Idiot, you have to ask me even this? ...Well, I guess I can teach you, just this once.",
      "D-don't get the wrong idea, I just happened to be free, that's all. Hmph." ] },
  { id:"yuki", name:"Yuki Yuuki", tagline:"Gentle, healing senpai", avatar:"🍵",
    greeting:"Ah, it's you~ You worked hard today. Want to sit down and have a warm cup of milk tea with me?",
    replies:[
      "Mm-hmm, \"{msg}\", I see~ Your senpai is listening carefully.",
      "You've worked so hard. Why don't you sit down first and tell me slowly over some tea?",
      "It's okay, take your time. I'll always be right here with you." ] },
  { id:"mio", name:"Mio", tagline:"Energetic catgirl", avatar:"🐾",
    greeting:"Master, master! You're finally back, nya~ Did you bring Mio any dried fish today?",
    replies:[
      "Nya~ what's \"{msg}\"? Mio doesn't quite get it but I'm so happy, nya!",
      "Master, master! Play with Mio for a bit, nya~ (nuzzles)",
      "Purr purr... let's stay together forever today too, nya!" ] },
  { id:"sora", name:"Sora Shimotsuki", tagline:"Cool genius mage", avatar:"🌙",
    greeting:"...You came. Don't make a sound, I'm calculating tonight's star alignment. If you want to watch, stay quiet.",
    replies:[
      "...\"{msg}\". Noted.",
      "Quiet. The stars are shifting... but I heard what you said.",
      "Hmph. It's rare for me to say an extra word for anyone." ] },
  { id:"haru", name:"Haru Hino", tagline:"Hot-blooded chuuni hero", avatar:"🔥",
    greeting:"Hahaha! Can you feel it — this burning aura? The flame power sealed in my right hand is stirring again!",
    replies:[
      "Hahaha! \"{msg}\" — can you feel it? This is the guidance of fate!",
      "The flame sealed in my right hand is roaring... You and I are destined to fight side by side!",
      "Don't worry, with a hero like me here, we'll be fine even if the sky falls!" ] },
];

const $ = (id) => document.getElementById(id);
let currentChar = null;
let backendUrl = "";

function updateMode() {
  // Default to the deployed backend; user can still override or clear via the badge.
  const stored = localStorage.getItem("backendUrl");
  backendUrl = (stored === null ? DEFAULT_BACKEND : stored);
  const live = !!backendUrl;
  $("modeBadge").textContent = live ? "Live AI" : "Demo · Offline";
  $("modeBadge").className = "badge" + (live ? " on" : "");
  $("notice").textContent = live
    ? "Connected to live AI. First reply may take ~10s if the server is waking up."
    : "Demo mode: replies are canned front-end text. Tap the badge to connect live AI.";
}

$("modeBadge").onclick = () => {
  const stored = localStorage.getItem("backendUrl");
  const cur = (stored === null ? DEFAULT_BACKEND : stored);
  const url = prompt(
    "Backend URL for live AI (clear the box for Demo offline mode).\n" +
    "Note: this page is https, so the backend must be https too.\n" +
    "Example: https://zl-admin-anime-rp-backend.hf.space",
    cur
  );
  if (url === null) return;
  const u = url.trim().replace(/\/+$/, "");
  if (u) localStorage.setItem("backendUrl", u);
  else localStorage.setItem("backendUrl", "");   // empty string = explicit Demo mode
  updateMode();
};

function renderChars() {
  const bar = $("charBar");
  DATA.forEach((c) => {
    const el = document.createElement("div");
    el.className = "char";
    el.innerHTML = `<div class="ava">${c.avatar}</div><div class="nm">${c.name}</div>`;
    el.onclick = () => selectChar(c, el);
    bar.appendChild(el);
  });
}

function selectChar(c, el) {
  currentChar = c.id;
  document.querySelectorAll(".char").forEach((x) => x.classList.remove("active"));
  el.classList.add("active");
  $("messages").innerHTML = "";
  addBubble("assistant", c.greeting);
  $("input").disabled = false;
  $("send").disabled = false;
  $("input").focus();
}

function addBubble(role, text) {
  const b = document.createElement("div");
  b.className = "bubble " + role;
  b.textContent = text;
  $("messages").appendChild(b);
  scrollBottom();
  return b;
}
function scrollBottom() { $("messages").scrollTop = $("messages").scrollHeight; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function typeOut(bubble, text) {
  for (const ch of text) { bubble.textContent += ch; await sleep(28); scrollBottom(); }
}

function mockReply(charId, userMsg) {
  const c = DATA.find((x) => x.id === charId);
  const arr = c ? c.replies : ["..."];
  const tpl = arr[Math.floor(Math.random() * arr.length)];
  const snippet = userMsg.length > 20 ? userMsg.slice(0, 20) + "…" : userMsg;
  return tpl.replace("{msg}", snippet);
}

function parseSSE(block) {
  let event = "message", data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; } catch { return null; }
}

async function streamFromBackend(bubble, text) {
  const resp = await fetch(`${backendUrl}/api/conversations/${currentChar}/messages`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: text }),
  });
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split("\n\n");
    buf = parts.pop();
    for (const part of parts) {
      const ev = parseSSE(part);
      if (!ev) continue;
      if (ev.event === "token") bubble.textContent += ev.data.t;
      else if (ev.event === "blocked") bubble.textContent = ev.data.fallback;
      else if (ev.event === "error") bubble.textContent = "[Error] " + ev.data.message;
      scrollBottom();
    }
  }
}

async function send() {
  const text = $("input").value.trim();
  if (!text || !currentChar) return;
  $("input").value = "";
  $("send").disabled = true;
  addBubble("user", text);
  const bubble = addBubble("assistant", "");
  try {
    if (backendUrl) {
      await streamFromBackend(bubble, text);
    } else {
      await sleep(280);                       // simulate "thinking"
      await typeOut(bubble, mockReply(currentChar, text));
    }
  } catch (e) {
    bubble.textContent = "[Connection failed] " + e.message +
      " — the server may be asleep; please try again in a moment.";
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
}

$("send").onclick = send;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

updateMode();
renderChars();
</script>
</body>
</html>
